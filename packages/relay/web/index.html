<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0c0c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="kremote" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>kremote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Login: ACCESS_KEY gate -->
  <div id="login" class="screen">
    <form id="login-form">
      <h1>kremote</h1>
      <p class="tagline">Terminal, files and git on your own machine — from any browser.</p>
      <label for="access-key">Access key</label>
      <input id="access-key" type="text" autocomplete="off" autocapitalize="characters"
             autocorrect="off" spellcheck="false" inputmode="text"
             placeholder="XXXXXXXX" maxlength="16" />
      <button type="submit">Connect</button>
      <button type="button" id="qr-open" class="qr-open"><span aria-hidden="true">▣</span> Scan QR code</button>
      <p id="login-error" class="error" hidden></p>
      <p class="hint">
        Mint one on the host with <code>kremote keygen &lt;device&gt;</code>.
        Keys are single-use.
      </p>
    </form>
  </div>

  <!-- QR scanner overlay: camera → the QR the agent prints (a URL with ?key=). -->
  <div id="qr-scan" hidden>
    <video id="qr-video" playsinline muted></video>
    <div id="qr-reticle" aria-hidden="true"></div>
    <p id="qr-hint">Point at the QR code printed by the agent</p>
    <button id="qr-close" aria-label="Close scanner">✕</button>
  </div>

  <!-- Workspace -->
  <div id="app" class="screen" data-view="home" hidden>
    <!-- Top bar: home / files / git / logs only. The terminal screen replaces
         it with its own slim bar so the pty gets the whole viewport. -->
    <header id="tabbar">
      <nav id="view-switcher" aria-label="View">
        <button class="view-btn active" data-view="home">Home</button>
        <button class="view-btn" data-view="files">Files</button>
        <button class="view-btn" data-view="git">Git</button>
        <button class="view-btn" data-view="tail">Logs</button>
      </nav>
      <button id="more-btn" title="More" aria-label="More actions" aria-haspopup="menu">•••</button>
      <span id="conn-state" title="Connection state" aria-hidden="true"></span>

      <!-- Overflow menu: secondary actions live here to keep the bar tidy. -->
      <div id="more-menu" role="menu" hidden>
        <button class="more-item" data-act="history" role="menuitem">⌘&nbsp; Command history</button>
        <button class="more-item" data-act="search" role="menuitem">🔍&nbsp; Search terminal</button>
        <button class="more-item" id="more-notify" data-act="notify" role="menuitem">🔔&nbsp; Notifications</button>
        <button class="more-item" data-act="settings" role="menuitem">⚙&nbsp; Settings</button>
      </div>
    </header>

    <!-- Home view: live sessions on the host + "new session". -->
    <main id="home" class="view">
      <div class="home-head">
        <span class="home-title">Sessions</span>
        <button id="sessions-refresh" class="home-ghost" title="Refresh" aria-label="Refresh">↻</button>
        <button id="new-session" class="home-cta">＋ New session</button>
      </div>
      <div id="sessions-list" role="list"></div>
    </main>

    <!-- Files view -->
    <main id="files" class="view" hidden>
      <div id="file-tree"></div>
      <div id="editor"></div>
    </main>

    <!-- Git view -->
    <main id="git" class="view" hidden>
      <div id="git-panel"></div>
    </main>

    <!-- Log tail view -->
    <main id="tail" class="view" hidden>
      <div id="tail-panel"></div>
    </main>

    <!-- Terminal screen: full-bleed, no view switcher. Back returns to Home. -->
    <main id="terminals" class="view" hidden>
      <div id="term-bar">
        <button id="term-back" aria-label="Back to sessions" title="Back to sessions">‹</button>
        <span id="term-title"></span>
        <span id="term-badge" class="term-badge live">live</span>
        <button id="term-kill" aria-label="Close session" title="Close session">✕</button>
      </div>
      <!-- Scrollback search (#6): floats over the active terminal. -->
      <div id="term-search" hidden>
        <input id="term-search-input" type="search" placeholder="Search output…"
               autocomplete="off" autocorrect="off" spellcheck="false" />
        <button id="term-search-prev" title="Previous match" aria-label="Previous match">↑</button>
        <button id="term-search-next" title="Next match" aria-label="Next match">↓</button>
        <button id="term-search-close" title="Close" aria-label="Close search">✕</button>
      </div>
      <div id="term-stack"></div>
    </main>

    <!-- Command history drawer (overlay, any view) -->
    <div id="history-drawer" hidden>
      <div class="drawer-head">
        <span>Command history</span>
        <button id="history-clear" title="Clear history">Clear</button>
        <button id="history-close" title="Close">✕</button>
      </div>
      <input id="history-search" type="search" placeholder="Search commands…" autocomplete="off" />
      <div id="history-pinned" role="list"></div>
      <div id="history-list" role="listbox"></div>
    </div>

    <!-- Settings popover -->
    <div id="settings-pop" hidden>
      <div class="settings-row">
        <label for="set-font">Terminal font size</label>
        <div class="stepper">
          <button id="font-minus" aria-label="Smaller">−</button>
          <span id="set-font">14</span>
          <button id="font-plus" aria-label="Bigger">+</button>
        </div>
      </div>
      <div class="settings-row">
        <label>Terminal theme</label>
        <div class="seg">
          <button id="theme-dark" class="active">Dark</button>
          <button id="theme-light">Light</button>
        </div>
      </div>
      <div class="settings-row">
        <label>Biometric lock</label>
        <button id="biolock-toggle" class="switch">Off</button>
      </div>
      <p class="settings-hint" id="biolock-hint"></p>
    </div>

    <footer id="mobile-keys" aria-label="Terminal keys">
      <button data-act="paste" aria-label="Paste clipboard" title="Paste">📋</button>
      <button data-act="copy" aria-label="Copy selection" title="Copy selection">⧉</button>
      <button data-act="search" aria-label="Search output" title="Search output">🔍</button>
      <button data-key="Control">Ctrl</button>
      <button data-key="Alt">Alt</button>
      <button data-key="Shift">Shift</button>
      <button data-seq="\x1b">Esc</button>
      <button data-seq="\t">Tab</button>
      <button data-seq="\x03" title="Ctrl+C">C-c</button>
      <button data-seq="\x04" title="Ctrl+D">C-d</button>
      <button data-seq="\x0c" title="Ctrl+L">C-l</button>
      <button data-seq="\x1a" title="Ctrl+Z">C-z</button>
      <button data-seq="\x1b[A" aria-label="Up">↑</button>
      <button data-seq="\x1b[B" aria-label="Down">↓</button>
      <button data-seq="\x1b[D" aria-label="Left">←</button>
      <button data-seq="\x1b[C" aria-label="Right">→</button>
      <button data-seq="|">|</button>
      <button data-seq="/">/</button>
      <button data-seq="~">~</button>
      <button data-seq="-">-</button>
      <button id="composer-toggle" aria-label="Toggle text composer">ABC</button>
    </footer>
    <!-- Mobile text composer: a real <input> so Gboard/Telex/IME composition
         works (xterm's hidden textarea breaks Vietnamese on mobile). Enter
         sends the whole line; it sits above the mobile-keys row. -->
    <div id="composer" hidden>
      <input id="composer-input" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" enterkeyhint="send"
             placeholder="Type a line… (Vietnamese OK)" />
      <button id="composer-send" aria-label="Send line">↵</button>
      <button id="composer-close" aria-label="Close composer">✕</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
